<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="nexoGradient" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4E75FF" />
      <stop offset="50%" stop-color="#8054FF" />
      <stop offset="100%" stop-color="#FF5694" />
    </linearGradient>
    <linearGradient id="nexoGlow" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4E75FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF5694" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glow Circle -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#nexoGlow)" />
  <!-- Nexo Core Sparkle Shape -->
  <path d="M24 8 C24 16.5 16.5 24 8 24 C16.5 24 24 31.5 24 40 C24 31.5 31.5 24 40 24 C31.5 24 24 16.5 24 8 Z" 
        fill="url(#nexoGradient)" 
        filter="url(#glowEffect)" />
  <!-- Inner Center Star Highlight -->
  <circle cx="24" cy="24" r="3" fill="#FFFFFF" opacity="0.9" />
  <!-- Small satellite spark -->
  <circle cx="36" cy="12" r="1.5" fill="#FF8EC7" />
  <circle cx="12" cy="36" r="1" fill="#7FA0FF" />
</svg>
